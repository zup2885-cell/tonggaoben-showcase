<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="戏伴工作台：明星、助理与团队的协作工作台。数据为虚构示例。">
<title>戏伴工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="paper.css">
<style>
/* Paper desk: single light look shared with the workbench. Entry = hero + three identity cards; workbench sits under a slim demo bar. */
:root{--d-paper:#ededea;--d-card:#fafaf7;--d-ink:#111;--d-muted:#55544f;--d-line:#cfcfca;--d-warn:#6d420b;--d-warn-bg:#f3e5cc;color-scheme:light}
html,body{height:100%}
body{background:var(--d-paper);color:var(--d-ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.demo-entry{min-height:100%;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-entry .wrap{max-width:1180px;margin:0 auto}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:12px;height:72px;border-bottom:1px solid #c9c9c4}
.d-brand{display:flex;align-items:center;gap:10px;font:700 22px "Songti SC","STSong","Noto Serif SC",serif}
.d-brand span{display:grid;place-items:center;width:30px;height:34px;background:var(--d-ink);color:#fff;font-size:19px;clip-path:polygon(0 0,22% 9%,50% 2%,78% 9%,100% 0,100% 100%,50% 90%,0 100%)}
.d-badge{font-size:12px;font-weight:600;background:var(--d-warn-bg);color:var(--d-warn);border:1px solid #d9b77a;border-radius:3px;padding:3px 9px}
.d-hero{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:24px;min-height:400px}
.d-eyebrow{display:flex;align-items:center;gap:10px;font:12px ui-monospace,SFMono-Regular,monospace;letter-spacing:1px;color:var(--d-muted);margin:0}
.d-eyebrow i{width:7px;height:7px;background:var(--d-ink)}
.d-hero h1{font:800 clamp(56px,7vw,104px)/1.05 -apple-system,"PingFang SC",sans-serif;letter-spacing:-4px;margin:20px 0 12px;color:var(--d-ink);text-wrap:balance}
.d-heading{font:700 clamp(22px,2.4vw,30px)/1.55 -apple-system,"PingFang SC",sans-serif;margin:0}
.d-desc{font-size:14px;color:var(--d-muted);margin:16px 0 0;line-height:1.9;max-width:34em}
.d-art{position:relative;height:400px;overflow:hidden}
.d-art .stage{position:absolute;inset:0 -5% 0 -12%;overflow:hidden;pointer-events:none}
.d-art video{position:absolute;width:151%;height:151%;object-fit:contain;left:-31%;top:-23%;max-width:none}
.bubble{position:absolute;right:10%;top:9%;z-index:2;display:flex;align-items:flex-end;gap:7px;padding:14px 17px;border:1.5px solid var(--d-ink);background:#ededed;box-shadow:4px 4px 0 #aaa;font:12px/1.8 ui-monospace,SFMono-Regular,monospace;color:var(--d-ink)}
.bubble:after{content:"";position:absolute;bottom:-9px;left:20px;width:15px;height:15px;background:#ededed;border-bottom:1.5px solid var(--d-ink);border-left:1.5px solid var(--d-ink);transform:skewY(-38deg)}
.bubble b{font-size:18px;line-height:1;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.d-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.d-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:150px 20px 18px;min-height:270px;background:var(--d-card);border:1px solid var(--d-line);border-radius:4px;cursor:pointer;color:var(--d-ink);font:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.d-card:hover,.d-card:focus-visible{border-color:var(--d-ink);box-shadow:0 4px 0 var(--d-ink);transform:translateY(-2px);outline:none}
.d-card img{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:120px;height:124px;object-fit:contain}
.d-card img.team{width:150px;height:140px;top:10px}
.d-card .no{position:absolute;left:16px;top:14px;font:11px ui-monospace,monospace;color:#6a6964}
.d-card strong{font:700 26px "Songti SC","STSong",serif}
.d-card small{font-size:13px;color:var(--d-muted)}
.d-card em{font-style:normal;font-weight:600;font-size:13.5px;margin-top:12px;padding-top:10px;border-top:1px solid #e3e2dc;align-self:stretch}
.d-note{margin:22px 0 0;font-size:12.5px;color:var(--d-muted);line-height:1.8}
.d-modal{border:1px solid var(--d-ink);border-radius:6px;padding:0;width:min(440px,calc(100vw - 32px));background:#fffefb;color:var(--d-ink);box-shadow:0 20px 80px #00000030}
.d-modal::backdrop{background:#0000004d;backdrop-filter:blur(4px)}
.d-modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e3e2dc}
.d-modal h2{font:700 19px "Songti SC","STSong",serif;margin:0}
.d-modal header button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--d-muted)}
.d-modal form{display:flex;flex-direction:column;gap:12px;padding:20px 22px 24px}
.d-modal p{margin:0;font-size:13px;color:var(--d-muted)}
.d-modal input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--d-line);border-radius:4px;background:#fff;color:var(--d-ink)}
.d-modal .go{font:inherit;font-weight:600;font-size:15px;padding:13px;border:0;border-radius:4px;background:var(--d-ink);color:#fff;cursor:pointer}
.d-bar{display:flex;align-items:center;gap:12px;height:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#f7f6f2;border-bottom:1px solid #deded9;font-size:13.5px}
.d-bar .d-brand{font-size:17px}.d-bar .d-brand span{width:24px;height:27px;font-size:15px}
.d-bar .who{margin-left:auto;color:var(--d-muted)}
.d-groups{display:flex;gap:4px;margin-left:12px;overflow-x:auto}
.d-bar .d-groups button{border:0;background:none;padding:6px 14px;font-size:14px;color:var(--d-muted);white-space:nowrap}
.d-bar .d-groups button.on{background:var(--d-ink);color:#fff;font-weight:600}
.d-bar button{font:inherit;border:1px solid #b9b9b2;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;color:var(--d-ink)}
.d-bar button:hover{border-color:var(--d-ink)}
body.in-app .app.own,body.in-app .app.own .center,body.in-app .app{height:calc(100vh - 48px)}
.d-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--d-ink);color:#fff;padding:11px 18px;border-radius:6px;font-size:13.5px;z-index:60;box-shadow:0 8px 30px #00000033}

/* Editorial type for the shareable demo: Noto Serif SC headings, Noto Sans SC text, Instrument Serif for English and numbers. */
body{font-family:"Noto Sans SC","PingFang SC",sans-serif}
.d-brand,.d-hero h1,.d-heading,.d-card strong,.d-modal h2,.bubble{font-family:"Noto Serif SC","Songti SC",serif!important}
.d-hero h1{font-weight:900;letter-spacing:.02em}.d-hero h1::after{content:""}
.d-eyebrow,.d-card .no{font:italic 17px "Instrument Serif",Georgia,serif!important;letter-spacing:0}
.d-eyebrow i{display:none}
.d-heading{font-weight:600;letter-spacing:.06em}
.d-card{border:0;border-radius:24px;box-shadow:0 1px 2px rgba(31,29,26,.04),0 14px 34px -16px rgba(31,29,26,.16)}
.d-card em{border-top:0}
.bubble{border-radius:14px;box-shadow:4px 4px 0 #c9c4b8}.bubble:after{display:none}
.d-modal{border:0;border-radius:24px}.d-modal input{border:0;border-radius:14px;background:#f3f0ea}.d-modal .go{border-radius:999px}
.d-bar .d-groups button{border-radius:999px}

/* Show the whole animated cat: no cropping zoom, and the box never clips it. */
.d-art{overflow:visible;height:460px}.d-art .stage{inset:-4% -6% -2% -6%;overflow:visible}
.d-art video{left:0;top:0;width:100%;height:100%;object-fit:contain;transform:scale(1.18);transform-origin:50% 55%}
@media (max-width:860px){.d-hero{grid-template-columns:1fr}.d-art{height:280px}.d-cards{grid-template-columns:1fr}.d-card{min-height:230px;padding-top:140px}body.in-app .app.own,body.in-app .app{height:auto}}
@media (prefers-reduced-motion:reduce){.bubble b{animation:none}.d-card{transition:none}}
.d-intro{margin-left:auto;font-size:14px;color:#6e5d4d;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}.d-intro:hover{color:#2b231c}
</style>
</head>
<body>


<section class="demo-entry" id="entry">
  <div class="wrap">
    <header class="d-top"><div class="d-brand"><span>戏</span>戏伴工作台</div><span class="d-badge">演示版 · 示例数据</span><a class="d-intro" href="../">← 产品介绍</a></header>
    <div class="d-hero">
      <div>
        <p class="d-eyebrow"><i></i>明星、助理与团队的协作工作台</p>
        <h1>戏伴工作台.</h1>
        <p class="d-heading">各司其职，<br>默契开场。</p>
        <p class="d-desc">选一个身份进入。每个人打开，看到的都是自己要做的事：明星准备角色和做决定，助理排档期、跟通告，团队分工协作。</p>
      </div>
      <div class="d-art" aria-hidden="true">
        <div class="bubble"><span>开工认真准备，<br>收工也照顾好自己。</span><b>▪</b></div>
        <div class="stage"><video src="cat-hero.webm" autoplay loop muted playsinline preload="auto"></video></div>
      </div>
    </div>
    <div class="d-cards">
      <button class="d-card" data-role="actor" type="button"><span class="no">01</span><img src="cat-mascot.png" alt=""><strong>明星</strong><small>表演准备、接戏决定与台词</small><em>进入明星工作台 ↗</em></button>
      <button class="d-card" data-role="assistant" type="button"><span class="no">02</span><img src="cat-assistant.png" alt=""><strong>助理</strong><small>档期、通告与执行跟进</small><em>进入助理工作台 ↗</em></button>
      <button class="d-card" data-role="team" type="button"><span class="no">03</span><img class="team" src="cat-team.png" alt=""><strong>团队</strong><small>项目分工、任务与资料</small><em>进入团队工作台 ↗</em></button>
    </div>
    <p class="d-note">演示版：成员、项目、通告都是虚构的示例；你填写的内容只保存在你自己的浏览器里，不会发给任何人。AI 分析为预置示例，没有调用真实模型。</p>
  </div>
</section>

<dialog class="d-modal" id="login">
  <header><h2 id="loginTitle">登录</h2><button type="button" id="loginClose" aria-label="关闭">×</button></header>
  <form id="loginForm"><p>演示阶段暂不需要密码，直接点「进入」。</p><input id="loginPass" type="password" placeholder="密码" autocomplete="off" aria-label="密码"><button class="go" type="submit">进入</button></form>
</dialog>

<div id="appShell" hidden>
  <div class="d-bar"><div class="d-brand"><span>戏</span>戏伴工作台</div><span class="d-badge">演示版</span><nav class="d-groups" id="dGroups" aria-label="分区"></nav><span class="who" id="who"></span><button type="button" id="switchRole">切换身份</button></div>
  <div class="app" id="app"><aside class="side" id="side"></aside><div class="center"><header class="top" id="top"></header><main class="main" id="main" tabindex="-1"></main></div><aside class="folder" id="folder"></aside></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
</div>
<div class="d-toast" id="dToast" role="status" hidden></div>

<script src="data.js"></script>
<script src="weather-snapshot.js"></script>
<script>
(() => {
  // The viewer frame refuses confirm(); the demo treats every confirmation as accepted.
  window.confirm = () => true;
  const ROLE = { actor: '明星', assistant: '助理', team: '团队' };
  const mem = {};
  const store = { get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : mem[k]; } catch { return mem[k]; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const day = n => { const d = new Date(Date.now() + n * 864e5); return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' }); };
  const members = [
    { userId: 'm-star', workspaceId: 'w', role: 'actor', name: '林知夏', email: '' },
    { userId: 'm-asst', workspaceId: 'w', role: 'assistant', name: '周小禾', email: '' },
    { userId: 'm-team', workspaceId: 'w', role: 'team', name: '陈一舟', email: '' }
  ];
  const rec = (id, kind, payload, visibility = 'core', createdBy = 'm-asst') => ({ id, kind, payload, revision: 1, deleted: 0, updatedAt: new Date().toISOString(), updatedBy: createdBy, createdBy, visibility });
  const records = [
    rec('proj-1', 'schedule', { name: '逆光来信', startDate: day(10), endDate: day(58), status: '锁档', decision: '接下', note: '' }, 'workspace'),
    rec('proj-2', 'schedule', { name: '第七号证人', startDate: day(48), endDate: day(99), status: '待定', decision: '', note: '' }),
    rec('proj-3', 'schedule', { name: '品牌春季拍摄', startDate: day(4), endDate: day(5), status: '待定', decision: '', note: '' }),
    rec('call-1', 'callDay', { date: day(0), projectCode: '逆光来信 定妆', location: '松江影视基地 3 号棚', makeupTime: '06:30', arrivalTime: '07:30', handoverTime: '', hotel: '', note: '', scenes: [{ id: 's1', number: '12', summary: '窗边的来信', cleared: true }, { id: 's2', number: '14', summary: '书店打烊', cleared: false }, { id: 's3', number: '21', summary: '天台独舞（走位）', cleared: false }], checklist: [] }),
    rec('call-2', 'callDay', { date: day(3), projectCode: '逆光来信 围读', location: '制片公司会议室', makeupTime: '', arrivalTime: '10:00', handoverTime: '', hotel: '', note: '', scenes: [], checklist: [] }),
    rec('task-1', 'task', { title: '确认第21场练功服', projectId: 'proj-1', assigneeId: 'm-team', dueDate: day(2), status: '进行中', priority: '重要', note: '' }, 'workspace'),
    rec('task-2', 'task', { title: '开机官宣海报文案 · 本人确认', projectId: 'proj-1', assigneeId: 'm-star', dueDate: day(4), status: '待确认', priority: '普通', note: '' }, 'workspace'),
    rec('task-3', 'task', { title: '订回程高铁与酒店', projectId: 'proj-1', assigneeId: 'm-asst', dueDate: day(1), status: '待开始', priority: '普通', note: '' }, 'workspace'),
    rec('task-4', 'task', { title: '舞蹈训练场地（周二 / 周四）', projectId: 'proj-1', assigneeId: 'm-team', dueDate: day(6), status: '待开始', priority: '普通', note: '' }, 'workspace'),
    rec('rem-1', 'reminder', { title: '定妆前一晚早点休息', fireAt: day(0) + ' 22:00', kind: '自定义', done: false }),
    rec('rem-2', 'reminder', { title: '围读带上第 1–12 场剧本', fireAt: day(3) + ' 08:30', kind: '场次', done: false })
  ];
  const visible = role => records.filter(r => r.visibility === 'workspace' || role !== 'team');
  let me = null, pid = '';
  const toastEl = document.getElementById('dToast');
  function toast(t) { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 2600); }
  const draftKey = () => `tgb-demo:${me.role}:${pid}`;
  function init() {
    const d = store.get(draftKey()) || { state: { version: 1, pages: {} }, revision: 0, updatedAt: null };
    setTimeout(() => LOCAL.deliver({ channel: 'tonggaoben-studio', type: 'init', me, members, workspace: { id: 'w', name: '戏伴工作台示例空间', ownerId: 'm-star' }, records: visible(me.role), projectId: pid, ...d }), 0);
  }
  const TAB = { today: '今天', schedule: '档期', lines: '台词练习', tasks: '任务', resources: '资料卡', messages: '留言', more: '我的', team: '项目总览' };
  const KIND = { task: '任务', resource: '资料卡', note: '准备笔记', line: '台词', schedule: '档期', callDay: '通告', reminder: '提醒', business: '商务' };
  const LOCAL = window.__STUDIO_LOCAL__ = {
    catBase: '',
    receive(m) {
      if (m.type === 'groups') {
        const nav = document.getElementById('dGroups'); nav.textContent = '';
        (m.items || []).forEach(gr => { const b = document.createElement('button'); b.type = 'button'; b.textContent = gr.label; b.className = gr.id === m.current ? 'on' : ''; b.addEventListener('click', () => LOCAL.deliver({ channel: 'tonggaoben-studio', type: 'group', id: gr.id })); nav.append(b); });
      }
      else if (!me) return;
      else if (m.type === 'ready' || m.type === 'reload') init();
      else if (m.type === 'project') { pid = m.id; init(); }
      else if (m.type === 'save') {
        const old = store.get(draftKey()) || { revision: 0 }, next = { state: m.state, revision: old.revision + 1, updatedAt: new Date().toISOString() };
        store.set(draftKey(), next);
        setTimeout(() => LOCAL.deliver({ channel: 'tonggaoben-studio', type: 'saved', requestId: m.requestId, revision: next.revision, updatedAt: next.updatedAt }), 150);
      }
      else if (m.type === 'navigate') toast(`演示版只包含工作台。正式版里这里会打开「${TAB[m.tab] || m.tab}」。`);
      else if (m.type === 'open') { const r = records.find(x => x.id === m.id); toast(`演示版：正式版里会打开「${r ? (r.payload.name || r.payload.projectCode || r.payload.title) : '详情'}」${r && r.kind === 'schedule' && me.role === 'actor' ? '，明星在这里确认接戏决定' : ''}。`); }
      else if (m.type === 'create') toast(`演示版：正式版里会打开「新建${KIND[m.kind] || ''}」，由你选择给谁看后保存。`);
    },
    deliver: null
  };
  const entry = document.getElementById('entry'), shell = document.getElementById('appShell'), dlg = document.getElementById('login');
  let picking = null;
  document.querySelectorAll('.d-card').forEach(b => b.addEventListener('click', () => {
    picking = b.dataset.role; document.getElementById('loginTitle').textContent = `${ROLE[picking]} · 登录`; document.getElementById('loginPass').value = '';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }));
  document.getElementById('loginClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault(); dlg.close();
    me = members.find(x => x.role === picking); pid = '';
    document.getElementById('who').textContent = `${me.name} · ${ROLE[me.role]}`;
    entry.hidden = true; shell.hidden = false; document.body.classList.add('in-app'); window.scrollTo(0, 0);
    init();
  });
  document.getElementById('switchRole').addEventListener('click', () => { me = null; shell.hidden = true; entry.hidden = false; document.body.classList.remove('in-app'); window.scrollTo(0, 0); });
})();
</script>
<script src="reference.js"></script>

</body>
</html>
